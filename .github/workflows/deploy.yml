name: Deploy to tenants-1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      # No unit suite yet — gate on the app importing cleanly, which catches
      # the broken-import class that silently bricks deploys.
      - name: Validate import
        working-directory: backend
        run: python -c "import app; print('import OK')"

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check]
    if: github.event_name != 'pull_request'
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 2222 -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy over SSH (git reset + restart)
        env:
          SHA: ${{ github.sha }}
        run: |
          ssh -p 2222 -i ~/.ssh/deploy_key oneconsensus@${{ secrets.VPS_HOST }} "SHA=$SHA bash -s" << 'ENDSSH'
            set -euo pipefail
            cd /opt/oneconsensus
            # Self-heal: a deleted/renamed remote branch can leave a corrupted
            # remote-tracking ref ("bad object refs/remotes/origin/*") that
            # aborts fetch. Prune, then drop any ref that no longer resolves.
            git remote prune origin >/dev/null 2>&1 || true
            for r in $(git for-each-ref --format='%(refname)' refs/remotes/origin 2>/dev/null); do
              git rev-parse --verify -q "$r^{commit}" >/dev/null 2>&1 || git update-ref -d "$r" 2>/dev/null || true
            done
            # Self-heal: a prior manual `sudo git` run can leave root-owned
            # artifacts (e.g. .git/FETCH_HEAD) that block the deploy user's
            # fetch with "Permission denied". Reclaim ownership best-effort,
            # then drop the stale FETCH_HEAD (git recreates it on fetch).
            sudo -n chown -R oneconsensus:oneconsensus /opt/oneconsensus/.git 2>/dev/null || true
            rm -f .git/FETCH_HEAD 2>/dev/null || true
            git fetch --quiet origin main
            AHEAD=$(git rev-list --count origin/main..HEAD)
            if [ "$AHEAD" -gt 0 ]; then
              echo "ABORT: $AHEAD local commit(s) ahead of origin/main would be lost"; exit 1
            fi
            git reset --hard origin/main
            backend/venv/bin/pip install -r backend/requirements.txt -q
            git rev-parse HEAD > /opt/oneconsensus/DEPLOYED_SHA
            sudo -n systemctl restart oneconsensus-api
            echo "Deploy complete: $(date -u)"
          ENDSSH

      - name: Verify deployment (health + SHA match)
        env:
          SHA: ${{ github.sha }}
        run: |
          sleep 6
          BODY=$(curl -sf -m 15 "https://api.oneconsensus.one/health" || echo '{}')
          echo "health: $BODY"
          GOT_SHA=$(echo "$BODY" | python3 -c "import sys,json; print(json.load(sys.stdin).get('sha',''))" 2>/dev/null || echo "")
          if [ "$GOT_SHA" != "$SHA" ]; then
            echo "::error::running SHA ($GOT_SHA) != shipped $SHA — restart did not pick up new code"; exit 1
          fi
          echo "Verified: running SHA matches $SHA"
